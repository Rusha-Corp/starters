# Local development — mirrors the production topology exactly.
# Run: docker compose up --build
#
# Services:
#   ui    → http://localhost:80    (static, nginx)
#   api   → http://localhost:8080  (Go Fiber)
#   db    → localhost:5432         (PostgreSQL 16)
#   cache → localhost:6379        (Redis 7)

services:
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: react-go-fiber-postgres-ui:dev
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
    image: react-go-fiber-postgres-api:dev
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://rusha:rusha@db:5432/rusha
      - REDIS_URL=redis://cache:6379
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rusha
      - POSTGRES_PASSWORD=rusha
      - POSTGRES_DB=rusha
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusha"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  cache_data:
