# Rusha system manifest — checked into the repo root.
# Rusha reads this file on every deploy to understand what to build and where.
#
# metadata is injected by Rusha at provisioning time — do not edit manually.
apiVersion: rusha.io/v1
kind: System
metadata:
  name: "{{ .SystemAlias }}"
  project: "{{ .ProjectAlias }}"
  org: "{{ .OrgAlias }}"
spec:
  template: svelte-fastify-postgres
  services:
    - name: ui
      type: static
      internetFacing: true
      vcs:
        baseImage: node:20-alpine
        buildCommand: "npm run build"
        buildDir: "ui/dist"

    - name: api
      type: server
      port: 3000
      internetFacing: true
      healthCheck:
        path: /health
        intervalSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      vcs:
        dockerfile: api/Dockerfile

    - name: db
      type: stateful
      shared: true
      port: 5432
      image: postgres:16
      storage: 20Gi
      healthCheck:
        command: ["pg_isready", "-U", "rusha"]
        intervalSeconds: 10
        timeoutSeconds: 5

    - name: prometheus
      type: stateful
      shared: true
      port: 9090
      image: prom/prometheus:v2.51.0
      storage: 10Gi

    - name: grafana
      type: stateful
      shared: true
      port: 3000
      image: grafana/grafana:10.4.2
      storage: 1Gi

  environment:
    - key: LOG_LEVEL
      value: INFO
    - key: LOG_FORMAT
      value: text
