# Rusha auto-deploy workflow.
# Push to dev/staging → builds and deploys to matching environment.
# Merge to main → tags with calver, builds, and deploys to production.
# Manual dispatch → build & deploy with calver tag from any branch.
#
# Branch/environment mapping:
#   dev     → dev
#   staging → staging
#   main    → production (with calver tag)
#
# Calver tag format: YYYY.MM.DD.N (e.g., 2026.05.18.0, 2026.05.18.1)
# Enables rollback to any tagged version.

name: Deploy via Rusha

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev

permissions:
  contents: write
  packages: write

jobs:
  # ─── Calver Tag (on merge to main only) ─────────────────────────────────────
  tag:
    name: Create Calver Tag
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    outputs:
      version: ${{ steps.calver.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate calver version
        id: calver
        run: |
          BASE_VERSION="$(date +'%Y.%m.%d')"
          # Count existing tags with the same base version to determine patch number
          PATCH=$(git tag -l "${BASE_VERSION}.*" | wc -l)
          VERSION="${BASE_VERSION}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tagging release: ${VERSION}"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.calver.outputs.version }}" -m "Release ${{ steps.calver.outputs.version }}"
          git push origin "${{ steps.calver.outputs.version }}"

  # ─── Build & Deploy to Production (on merge to main) ───────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: tag
    if: always() && needs.tag.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name for GHCR
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}/api:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.lower }}/api:${{ needs.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Trigger Rusha deploy
        uses: actions/github-script@v7
        with:
          script: |
            const repoName = context.repo.repo;
            const repoLower = `${{ steps.repo.outputs.lower }}`;
            const version = `${{ needs.tag.outputs.version }}`;

            await fetch(`${process.env.RUSHA_WEBHOOK_URL}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Rusha-Signature': process.env.RUSHA_WEBHOOK_SECRET,
              },
              body: JSON.stringify({
                repoName,
                ref: `refs/tags/${version}`,
                sha: context.sha,
                environment: 'production',
                images: {
                  api: `ghcr.io/${repoLower}/api:${version}`,
                },
              }),
            });
        env:
          RUSHA_WEBHOOK_URL: ${{ secrets.RUSHA_WEBHOOK_URL }}
          RUSHA_WEBHOOK_SECRET: ${{ secrets.RUSHA_WEBHOOK_SECRET }}

  # ─── Build & Deploy (dev/staging — on push) ────────────────────────────────
  deploy-staging:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name for GHCR
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.lower }}/api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Trigger Rusha deploy
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const envMap = { dev: 'dev', staging: 'staging' };
            const environment = envMap[branch] ?? 'dev';
            const repoName = context.repo.repo;
            const repoLower = `${{ steps.repo.outputs.lower }}`;

            await fetch(`${process.env.RUSHA_WEBHOOK_URL}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Rusha-Signature': process.env.RUSHA_WEBHOOK_SECRET,
              },
              body: JSON.stringify({
                repoName,
                ref: context.ref,
                sha: context.sha,
                environment,
                images: {
                  api: `ghcr.io/${repoLower}/api:${context.sha}`,
                },
              }),
            });
        env:
          RUSHA_WEBHOOK_URL: ${{ secrets.RUSHA_WEBHOOK_URL }}
          RUSHA_WEBHOOK_SECRET: ${{ secrets.RUSHA_WEBHOOK_SECRET }}
