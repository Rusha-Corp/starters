name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  # ─── API Tests (Quarkus / Java 21 / Maven) ─────────────────────────────────
  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Build and test
        run: ./mvnw clean verify -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: api/target/surefire-reports/

  # ─── API Security Scan ─────────────────────────────────────────────────────
  api-security:
    name: API Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Run Maven dependency check
        run: ./mvnw org.owasp:dependency-check-maven:check -q || true

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dependency-check-report
          path: api/target/dependency-check-report.html

  # ─── UI Tests (skeleton — skip) ────────────────────────────────────────────
  ui-test:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip — UI skeleton
        run: echo "UI skeleton — skipping tests"

  # ─── UI Dependency Audit (skeleton — skip) ─────────────────────────────────
  ui-security:
    name: UI Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Skip — UI skeleton
        run: echo "UI skeleton — skipping security audit"
