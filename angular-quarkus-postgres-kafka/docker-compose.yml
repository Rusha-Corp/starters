# Local development — mirrors the production topology exactly.
# Run: docker compose up --build
#
# Services:
#   ui    → http://localhost:80    (static, nginx)
#   api   → http://localhost:8080  (Quarkus)
#   db    → localhost:5432         (PostgreSQL 16)
#   queue → localhost:9092         (Kafka 3)

services:
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: angular-quarkus-postgres-kafka-ui:dev
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
    image: angular-quarkus-postgres-kafka-api:dev
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/rusha
      - QUARKUS_DATASOURCE_USERNAME=rusha
      - QUARKUS_DATASOURCE_PASSWORD=rusha
      - KAFKA_BOOTSTRAP_SERVERS=queue:9092
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rusha
      - POSTGRES_PASSWORD=rusha
      - POSTGRES_DB=rusha
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusha"]
      interval: 5s
      timeout: 5s
      retries: 5

  queue:
    image: bitnami/kafka:3
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://queue:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@queue:9093
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - queue_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  queue_data:
