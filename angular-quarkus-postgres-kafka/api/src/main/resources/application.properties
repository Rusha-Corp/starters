# Quarkus HTTP
quarkus.http.port=8080

# Datasource (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://db:5432/rusha}
quarkus.datasource.username=${DATABASE_USER:rusha}
quarkus.datasource.password=${DATABASE_PASSWORD:rusha}
quarkus.datasource.jdbc.min-size=3
quarkus.datasource.jdbc.max-size=20

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:queue:9092}

# SmallRye Health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready
quarkus.smallrye-health.startup-path=/q/health/started
