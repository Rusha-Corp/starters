# Local development — mirrors the production topology exactly.
# Run: docker compose up --build
#
# Services:
#   ui    → http://localhost:3000  (Next.js SSR)
#   api   → http://localhost:8000  (Django/Gunicorn)
#   db    → localhost:5432         (PostgreSQL 16)
#   cache → localhost:6379        (Redis 7)

services:
  ui:
    build:
      context: ./ui
    image: nextjs-django-postgres-ui:dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - .env.example
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
    image: nextjs-django-postgres-api:dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://rusha:rusha@db:5432/rusha
      - REDIS_URL=redis://cache:6379
      - SECRET_KEY=dev-secret-change-in-production
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rusha
      - POSTGRES_PASSWORD=rusha
      - POSTGRES_DB=rusha
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusha"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  cache_data:
